<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Details</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        h2 {
            color: #00E5FF;
            font-size: 22px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #8F8F99;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .card {
            background: #111115;
            border: 1px solid #22222d;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: right;
        }
        .card h3 {
            color: #FFD700;
            font-size: 16px;
            margin-top: 0;
        }
        .badge {
            background: rgba(0, 229, 255, 0.1);
            color: #00E5FF;
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 229, 255, 0.3);
        }
        .btn-wa {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: bold;
            display: block;
            text-align: center;
            margin-top: 25px;
            box-shadow: 0px 4px 15px rgba(37, 211, 102, 0.3);
        }
        .ads-space {
            background: #1a1a24;
            border: 2px dashed #33334d;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            color: #7a7a99;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>اشتراك VIP المدفوع</h2>
        <p class="subtitle">أفضل تجربة أنترنيت سريعة ومستقرة</p>

        <div class="badge">
            معرف الجهاز (ID): <b style="color:#fff;">{{ANDROID_ID}}</b>
        </div>

        <div class="card">
            <h3>💎 العروض المتاحة</h3>
            <p>• شهر واحد: <b>20 درهم</b></p>
            <p>• شهرين: <b>35 درهم</b></p>
            <p style="margin-bottom:0;">الأيام المتبقية في اشتراكك: <b style="color:#00E5FF;">{{DAYS_LEFT}} أيام</b></p>
        </div>

        <!-- مكان مخصص لإضافة إعلانات مستقبلاً -->
        <div class="ads-space">
            📢 مكان مخصص للإعلانات (Ad Banner Space)
        </div>

        <a href="https://wa.me/212771796228?text=مرحبا،%20أريد%20الاشتراك%20في%20VIP.%20الآيدي:%20{{ANDROID_ID}}" class="btn-wa">
            تواصل عبر واتساب للتفعيل 🚀
        </a>
    </div>

</body>
</html>
