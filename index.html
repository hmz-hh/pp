<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أزرار ملونة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        /* هادا هو الكود لي كيلون الأزرار كاملين (CSS) */
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-red { background-color: #ff4d4d; }
        .btn-green { background-color: #4CAF50; }
        .btn-blue { background-color: #2196F3; }
        .btn-yellow { background-color: #ffeb3b; color: black; }
    </style>
</head>
<body>
    <h3 style="color: #333;">عزل اللون لي بغيتي:</h3>
    
    <button class="btn-red" onclick="sendToBot('red')">زر أحمر 🔴</button>
    <button class="btn-green" onclick="sendToBot('green')">زر أخضر 🟢</button>
    <button class="btn-blue" onclick="sendToBot('blue')">زر أزرق 🔵</button>
    <button class="btn-yellow" onclick="sendToBot('yellow')">زر أصفر 🟡</button>

    <script>
        // كنعلمو تيليغرام بلي هادي صفحة ديالو
        let tg = window.Telegram.WebApp;
        tg.expand(); // باش الباج تفتح على الشاشة كاملة

        // هاد الدالة كتصيفط الداتا للبوت ملي كنكليكيو على شي زر
        function sendToBot(color) {
            tg.sendData(color); // كنصيفطو اللون
            tg.close(); // كنسدو الواجهة باش نرجعو للبوت
        }
    </script>
</body>
</html>
