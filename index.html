        /* الشبكة المتحركة في الخلفية - زيادة وضوح الخطوط */
        .cyber-grid {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 15%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 15%, transparent 80%);
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }
        /* تأثير الألوان المتحركة في العناوين */
        .text-gradient-animate {
            background: linear-gradient(to right, var(--neon-1), var(--neon-3), var(--neon-2));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textShine 4s linear infinite;
        }
        @keyframes textShine {
            to { background-position: 200% center; }
        }
        /* الكروت ذات الحواف المضيئة الهادئة */
        .epic-card {
            position: relative;
            background: rgba(12, 12, 16, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            z-index: 1;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .epic-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 1.6rem;
            background: linear-gradient(45deg, var(--neon-1), var(--neon-2), var(--neon-3));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.25s ease;
            filter: blur(6px);
        }
        .epic-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
            pointer-events: none;
            transition: border-color 0.25s ease;
        }
        .epic-card:hover {
            transform: translateY(-1px);
        }
        .epic-card:hover::before {
            opacity: 0.85;
        }
        .epic-card:hover::after {
            border-color: rgba(255,255,255,0.2);
        }
        .epic-card-content {
            position: relative;
            z-index: 3;
            background: #070709;
            border-radius: 1.4rem;
            padding: 1.2rem;
            height: 100%;
        }
        .icon-glow {
            box-shadow: inset 0 0 20px rgba(255,255,255,0.03);
        }
    </style>
