<!DOCTYPE html>
<html>
<body>

<input id="one" placeholder="First"><br><br>
<input id="two" placeholder="Second"><br><br>
<input id="three" placeholder="Third"><br><br>

<button onclick="send()">Send</button>

<script>
async function send() {
    const token = "8849123537:AAGPuG8Pu6MTv4VYD_39_6COicEfRS5sWPc";
    const chatId = "7641676955";

    const text =
        document.getElementById("one").value + "|" +
        document.getElementById("two").value + "|" +
        document.getElementById("three").value;

    await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            chat_id: chatId,
            text: text
        })
    });

    alert("Sent");
}
</script>

</body>
</html>
