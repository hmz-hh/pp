<!DOCTYPE html>
<html lang="ar">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 6px;
    background: transparent;
    font-family: Arial, sans-serif;
}

.card {
    width: 92%;
    max-width: 390px;
    margin: auto;
    position: relative;
    overflow: hidden;

    padding: 10px 11px;

    background: linear-gradient(
        135deg,
        #17191d 0%,
        #0b0d10 100%
    );

    border: 1px solid rgba(0,229,255,.22);
    border-radius: 15px;

    box-shadow:
        0 7px 22px rgba(0,0,0,.35),
        inset 0 0 20px rgba(0,229,255,.025);

    color: #fff;
}

.card::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    top: -60px;
    right: -30px;

    background: rgba(0,229,255,.10);
    filter: blur(30px);
    border-radius: 50%;
}

/* HEADER */
.top {
    position: relative;
    display: flex;
    align-items: center;
    gap: 9px;
}

.warning-icon {
    width: 34px;
    height: 34px;
    min-width: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(229,57,53,.08);
    border: 1px solid rgba(229,57,53,.25);
    border-radius: 10px;
}

.warning-icon svg {
    width: 18px;
    height: 18px;
}

.info {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 11px;
    font-weight: 800;
    color: #fff;
}

.expiry {
    margin-top: 2px;
    font-size: 9px;
    color: #7f858e;
}

.days {
    color: #00e5ff;
    font-size: 14px;
    font-weight: 900;
}

/* OFFERS */
.offers {
    position: relative;
    display: flex;
    gap: 6px;
    margin-top: 8px;
}

.offer {
    flex: 1;
    min-width: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 7px 8px;

    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px;
}

.offer.best {
    border-color: rgba(0,229,255,.28);
    background: rgba(0,229,255,.045);
}

.offer-left {
    display: flex;
    align-items: center;
    gap: 5px;
}

.offer-icon {
    display: flex;
    align-items: center;
}

.offer-icon svg {
    width: 14px;
    height: 14px;
}

.offer-name {
    color: #aeb3bb;
    font-size: 8px;
    white-space: nowrap;
}

.price {
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
}

.currency {
    color: #00e5ff;
    font-size: 7px;
}

.best-label {
    margin-left: 3px;
    padding: 2px 4px;

    background: rgba(0,229,255,.10);
    border-radius: 5px;

    color: #00e5ff;
    font-size: 6px;
    font-weight: 800;
    white-space: nowrap;
}

/* FREE RENEW MESSAGE */
.free-note {
    position: relative;

    margin-top: 7px;
    padding: 6px 8px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    background: rgba(0,229,255,.045);
    border: 1px solid rgba(0,229,255,.12);
    border-radius: 8px;

    color: #9ea5ad;
    font-size: 8px;
    font-weight: 700;
}

.free-note svg {
    width: 13px;
    height: 13px;
}

.free-note strong {
    color: #00e5ff;
}

/* WHATSAPP BUTTON */
.renew {
    position: relative;

    width: 100%;
    height: 31px;

    margin-top: 7px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    background: linear-gradient(
        135deg,
        #00c9a7,
        #009b83
    );

    border-radius: 9px;

    color: #fff;
    font-size: 9px;
    font-weight: 800;

    box-shadow:
        0 4px 13px rgba(0,191,165,.20);
}

/* WHATSAPP ICON */
.whatsapp-icon {
    width: 17px;
    height: 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;
    border-radius: 50%;
}

.whatsapp-icon svg {
    width: 12px;
    height: 12px;
}

.arrow {
    font-size: 13px;
    margin-left: 1px;
}

/* SMALL DEVICES */
@media (max-width: 320px) {

    body {
        padding: 4px;
    }

    .card {
        width: 94%;
        padding: 9px;
        border-radius: 13px;
    }

    .warning-icon {
        width: 30px;
        height: 30px;
        min-width: 30px;
    }

    .warning-icon svg {
        width: 16px;
        height: 16px;
    }

    .title {
        font-size: 10px;
    }

    .days {
        font-size: 13px;
    }

    .offer {
        padding: 6px;
    }

    .offer-name {
        font-size: 7px;
    }

    .price {
        font-size: 12px;
    }

    .best-label {
        display: none;
    }

    .free-note {
        font-size: 7px;
    }

    .renew {
        height: 29px;
        font-size: 8px;
    }
}
</style>
</head>

<body>

</html>
