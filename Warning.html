<!DOCTYPE html>
<html lang="ar">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        .warning-card {
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            gap: 13px;

            padding: 14px 16px;

            background: linear-gradient(
                135deg,
                #18191d 0%,
                #0d0e11 100%
            );

            border: 1px solid rgba(229, 57, 53, 0.65);
            border-radius: 18px;

            color: #fff;
            text-decoration: none;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35),
                0 0 18px rgba(229, 57, 53, 0.12);

            transition: transform 0.2s ease;
        }

        .warning-card:active {
            transform: scale(0.98);
        }

        /* Glow */
        .warning-card::before {
            content: "";
            position: absolute;

            top: -45px;
            left: -45px;

            width: 130px;
            height: 130px;

            background: rgba(229, 57, 53, 0.13);
            filter: blur(30px);

            border-radius: 50%;
        }

        /* Icon */
        .icon {
            position: relative;
            z-index: 1;

            width: 44px;
            height: 44px;
            min-width: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(229, 57, 53, 0.10);

            border: 1px solid rgba(229, 57, 53, 0.30);
            border-radius: 13px;

            box-shadow:
                inset 0 0 12px rgba(229, 57, 53, 0.05);
        }

        .icon svg {
            width: 22px;
            height: 22px;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 1;

            flex: 1;
            min-width: 0;
        }

        .title {
            margin-bottom: 4px;

            color: #ffffff;

            font-size: 13px;
            font-weight: 700;
        }

        .days-line {
            color: #d8dbe0;

            font-size: 13px;
            font-weight: 500;
        }

        .days {
            color: #00e5ff;

            font-size: 18px;
            font-weight: 800;
        }

        .subtitle {
            margin-top: 3px;

            color: #858a94;

            font-size: 10.5px;
            font-weight: 500;
        }

        /* Renew Button */
        .renew {
            position: relative;
            z-index: 1;

            padding: 9px 13px;

            background: linear-gradient(
                135deg,
                #e53935,
                #c62828
            );

            border-radius: 11px;

            color: #ffffff;

            font-size: 11px;
            font-weight: 800;

            white-space: nowrap;

            box-shadow:
                0 5px 14px rgba(229, 57, 53, 0.25);
        }

        .arrow {
            margin-left: 3px;
            font-size: 13px;
        }

        /* Small screens */
        @media (max-width: 340px) {
            .warning-card {
                padding: 12px;
                gap: 9px;
            }

            .icon {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }

            .renew {
                padding: 8px 10px;
                font-size: 10px;
            }

            .subtitle {
                display: none;
            }
        }
    </style>
</head>

<body>

<a
    href="https://wa.me/212771796228?text=مرحبا، بغيت نجدد الاشتراك. ID: {{ANDROID_ID}}"
    class="warning-card"
>

    <!-- Real SVG Icon -->
    <div class="icon">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                d="M12 8V12"
                stroke="#FF5252"
                stroke-width="2"
                stroke-linecap="round"
            />

            <circle
                cx="12"
                cy="16"
                r="1"
                fill="#FF5252"
            />

            <path
                d="M10.3 3.9L2.8 17C2 18.4 3 20.2 4.6 20.2H19.4C21 20.2 22 18.4 21.2 17L13.7 3.9C12.9 2.5 11.1 2.5 10.3 3.9Z"
                stroke="#FF5252"
                stroke-width="1.7"
                stroke-linejoin="round"
            />

        </svg>

    </div>

    <!-- Text -->
    <div class="content">

        <div class="title">
            اشتراكك غادي يسالي قريب
        </div>

        <div class="days-line">
            باقي
            <span class="days">{{DAYS_LEFT}}</span>
            أيام
        </div>

        <div class="subtitle">
            جدد الاشتراك باش تبقى متصل بدون انقطاع
        </div>

    </div>

    <!-- Renew Button -->
    <div class="renew">
        تجديد
        <span class="arrow">›</span>
    </div>

</a>

</body>
</html>
