<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال البيانات</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; margin: 0; color: #fff; }
        .container { background: #333; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 100%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #555; border-radius: 5px; box-sizing: border-box; font-size: 16px; background: #222; color: #fff; }
        button { width: 100%; padding: 12px; background: #0088cc; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0077b3; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="text-align: center;">إضافة مستخدم جديد</h3>
    <input type="text" id="input1" placeholder="الخانة الأولى (مثلا: الايدي)">
    <input type="text" id="input2" placeholder="الخانة الثانية (مثلا: الرصيد)">
    <input type="text" id="input3" placeholder="الخانة الثالثة">
    <input type="text" id="input4" placeholder="الخانة الرابعة">
    <button onclick="sendToBot()">إرسال</button>
</div>

<script>
    function sendToBot() {
        const i1 = document.getElementById('input1').value;
        const i2 = document.getElementById('input2').value;
        const i3 = document.getElementById('input3').value;
        const i4 = document.getElementById('input4').value;

        if(!i1 || !i2 || !i3 || !i4) {
            alert("عمر كلشي عافاك!");
            return;
        }

        // الرسالة لي غتمشي للبوت
        const message = `[NEW_DATA]\n1:${i1}\n2:${i2}\n3:${i3}\n4:${i4}`;
        
        // التوكن والايدي ديالك
        const token = "8995901866:AAHppeuMfQgK2oZYxdI6daJDBbBtpaPSyb0";
        const chatId = "8313227172";
        const tgUrl = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

        fetch(tgUrl)
            .then(response => {
                if(response.ok) {
                    alert("تم الإرسال بنجاح!");
                    // تفريغ الخانات
                    document.querySelectorAll('input').forEach(input => input.value = '');
                }
            })
            .catch(err => alert("وقع شي مشكل فالاتصال"));
    }
</script>

</body>
</html>
