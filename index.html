<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        h2 {
            color: #5CB85C; /* اللون الأخضر اللي خدمنا بيه فالتصميم السابق */
            margin-top: 0;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #555;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #0088cc; /* لون تيليجرام */
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0077b5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 تحديث هام!</h2>
        <p>تم إضافة سيرفرات جديدة لتحسين سرعة الاتصال واستقرار الشبكة.</p>
        <p>المرجو الانضمام لقناتنا الرسمية لمتابعة كل جديد.</p>
        <!-- بدل هاد الرابط بالرابط ديال قناتك فتيليجرام -->
        <a href="https://t.me/free_net_mrr" class="btn">دخول للقناة</a>
    </div>

</body>
</html>
