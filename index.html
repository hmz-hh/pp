<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* هاد الجزء هو اللي كيخلي الخلفية شفافة وكيوسط البطاقة فالشاشة */
        body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 320px;
        }
        h2 {
            color: #5CB85C;
            margin-top: 0;
            font-size: 22px;
        }
        p {
            font-size: 15px;
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-tg {
            padding: 12px;
            background-color: #0088cc;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-skip {
            padding: 12px;
            background-color: #f1f1f1;
            color: #555;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🚀 تحديث هام!</h2>
        <p>تم إضافة سيرفرات جديدة لتحسين سرعة الاتصال واستقرار الشبكة. يرجى الانضمام لقناتنا الرسمية.</p>
        
        <div class="buttons">
            <a href="https://t.me/free_net_mrr" class="btn-tg">دخول للقناة</a>
            <!-- هادا هو الزر اللي غيسد النافذة -->
            <a href="app://close" class="btn-skip">تخطي</a>
        </div>
    </div>

</body>
</html>
